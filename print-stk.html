    const W=o.W||760, S=o.S||2, id=el.id||(el.id='pk'+Date.now()), pc=printCss()+(o.css||'');
    let BP=[], EH=0, EW=0;
    const prep=(d,meas)=>{ const st=d.createElement('style'); st.textContent=pc+'\n*{animation:none!important;transition:none!important}'; d.head.appendChild(st); if(o.cls) o.cls.split(' ').forEach(c=>c&&d.body.classList.add(c));
      const t=d.getElementById(id); if(!t) return; t.style.setProperty('display','block','important'); if(o.clean) t.querySelectorAll(o.clean).forEach(z=>z.remove()); t.querySelectorAll('details').forEach(z=>z.open=true);
      if(meas){ const r0=t.getBoundingClientRect(); EH=Math.ceil(Math.max(t.scrollHeight,r0.height)); EW=Math.ceil(r0.width); const s=new Set();
        t.querySelectorAll('tr,h1,h2,h3,h4,h5,p,li,summary,table,img,div,section,details').forEach(z=>{ const r=z.getBoundingClientRect(); if(r.height>0) s.add(Math.round(r.bottom-r0.top)); });
        BP=[...s].filter(v=>v>0).sort((a,b)=>a-b); } };
    const base={backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:W,scrollX:0,scrollY:0};
    await H(el,{...base,scale:.05,height:4,onclone:d=>prep(d,true)}); if(!EH||!EW) throw new Error('empty');
    const ratio=(842-2*30)/(595-2*30), PC=Math.floor(EW*ratio), pages=[]; let s=0;
    while(s<EH-2){ let b=s+PC; if(b<EH){ const c=BP.filter(v=>v>s+PC*.35&&v<=s+PC); if(c.length) b=c[c.length-1]; } else b=EH; pages.push([s,b]); s=b; }
    const one=EW*S*EH*S<=12e6, imgs=[], N=pages.length, put=(cv,hCss)=>{ const dw=595-60, dh=dw*hCss/EW; imgs.push({...jpg(cv,.88),pw:595,ph:842,x:30,y:842-30-dh,dw,dh}); };
    let big=null; if(one) big=await H(el,{...base,scale:S,height:EH,onclone:d=>prep(d,false)});
    for(let k=0;k<N;k++){ const [a,b]=pages[k]; if(N>1) busy((E?'Making the PDF… ':'PDF बन रहा है… ')+(k+1)+' / '+N);
      let cv; if(big){ cv=document.createElement('canvas'); cv.width=big.width; cv.height=Math.max(1,Math.round((b-a)*S)); const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(big,0,Math.round(a*S),big.width,cv.height,0,0,cv.width,cv.height); }
      else cv=await H(el,{...base,scale:S,y:a,height:b-a,onclone:d=>prep(d,false)});
      put(cv,b-a); await wait(0); }
    busy(null); give(blob(imgs),o.fname||document.title||'print'); }); }
// ---- 13 x 19 print sheets: every .sheet = one page, exact size
function sheets(sel,wIn,hIn,fname,o){ o=o||{}; return run(async E=>{ const L2=[...document.querySelectorAll(sel)]; if(!L2.length) throw new Error('no sheets');
    busy(E?'Making the PDF…':'PDF बन रहा है…'); const H=await h2c(); try{ await document.fonts.ready; }catch(_){}
    // little SVG icons written straight into the CSS (e.g. the 📍 before a venue) -> base64, so the picture maker draws them too
    let svgFix=''; for(const ss of Array.from(document.styleSheets)){ let rs; try{ rs=ss.cssRules; }catch(_){ continue; } for(const r of Array.from(rs||[])){ const bi=r.style&&r.style.backgroundImage||'';
      const m=/url\(["']?data:image\/svg\+xml;utf8,([\s\S]*?)["']?\)$/.exec(bi); if(m&&r.selectorText){ try{ svgFix+=r.selectorText+'{background-image:url("data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(decodeURIComponent(m[1].replace(/\\"/g,'"')))))+'")!important}\n'; }catch(_){} } } }
    const S=o.S||2.2, imgs=[], css='.sheet{zoom:1!important;transform:none!important;margin:0!important;box-shadow:none!important}'+svgFix+(o.css||'');
    const opt=(extra,fix)=>({scale:S,backgroundColor:'#ffffff',logging:false,useCORS:true,scrollX:0,scrollY:0,onclone:d=>{ const st=d.createElement('style'); st.textContent=css+(extra||''); d.head.appendChild(st); if(fix) fix(d); }});
    for(let i=0;i<L2.length;i++){ busy((E?'Making the PDF… sheet ':'PDF बन रहा है… शीट ')+(i+1)+' / '+L2.length);
      // o.sub: scaled parts (programme cards) are drawn one by one at their own size, then put in place – keeps them exact
      const cv=await H(L2[i],opt(o.sub?o.sub+'{visibility:hidden!important}':''));
      if(o.sub){ const g=cv.getContext('2d'), k=cv.width/(wIn*96); let n=0; g.setTransform(1,0,0,1,0,0);   // html2canvas leaves its own scale on the canvas
        for(const el of Array.from(L2[i].querySelectorAll(o.sub))){ const hold=el.parentElement, sc=parseFloat((/scale\(([\d.]+)\)/.exec(el.style.transform||'')||[])[1]||'1'), id=el.id||(el.id='pks'+i+'_'+(n++));
          const tf=el.style.transform; el.style.transform='none'; let c2; try{ c2=await H(el,{...opt(''),scale:S*sc}); } finally{ el.style.transform=tf; }
          g.setTransform(1,0,0,1,0,0); g.drawImage(c2,parseFloat(hold.style.left)*k,parseFloat(hold.style.top)*k,parseFloat(hold.style.width)*k,parseFloat(hold.style.height)*k); c2.width=c2.height=1; } }
      imgs.push({...jpg(cv,.92),pw:wIn*72,ph:hIn*72}); cv.width=cv.height=1; await wait(0); }
    busy(null); give(blob(imgs),fname||document.title||'print'); }); }
return {MOB,en,busy,say,fonts,blob,give,table,html,sheets,h2c};
})();
