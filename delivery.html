:root{--iv:#FBF8EF;--iv2:#F4EEDD;--ol:#4E5B2E;--ol2:#2F3A12;--gd:#B8892E;--gl:#E9C46A;--mh:#5F6E33;--yl:#FFF4C2;--mr:#8E1B0E;--ink:#1F2610;--mu:#7A6A3A}
*{box-sizing:border-box}html,body{margin:0;background:var(--iv);color:var(--ink);font-family:"Tiro Devanagari Hindi",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}.M{font-family:"Martel",serif;font-weight:700}
.gl{height:2px;border:0;margin:8px auto;width:70%;background:linear-gradient(90deg,transparent,var(--gd) 25%,var(--gd) 75%,transparent)}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 80px}
.hd{text-align:center;padding:14px 0 4px}.hd img{width:70px;height:70px}.hd h1{font-family:"Martel";font-size:22px;margin:2px 0 0;color:var(--ol)}
.hd p{margin:2px 0 0;font-size:13px;color:var(--mu)}.who{font-size:12.5px;color:var(--mu);text-align:center;margin-top:2px}
.scr{display:none}.scr.on{display:block}
.card{background:#fff;border:1px solid #E3D9BD;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(79,91,46,.06)}
.card h2{font-family:"Martel";font-size:18px;color:var(--ol);margin:0 0 6px;text-align:center}.card p{margin:6px 0;line-height:1.55}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.in{width:100%;padding:11px 12px;border:1.5px solid #D8CDAE;border-radius:10px;background:var(--iv);font-size:16px}
.btn{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--ol);color:#fff;font-family:"Martel";font-size:17px}
.btn:disabled{opacity:.55}.muted{color:var(--mu);font-size:13px;text-align:center}.err{color:var(--mr);font-size:14px;text-align:center;margin-top:8px;min-height:1em}
.spin{width:34px;height:34px;border:3px solid #E3D9BD;border-top-color:var(--gd);border-radius:50%;margin:14px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.req{display:flex;gap:8px;align-items:center;border-bottom:1px solid #EFE6CC;padding:10px 0}#mb .req{flex-wrap:wrap}#mb .req .w{flex:1 1 100%;min-width:0}.req:last-child{border:0}.req .w{flex:1;min-width:0}.req .w b{font-family:"Martel";color:var(--ol)}
.req .w small{display:block;color:var(--mu);font-size:12.5px}.ok{background:var(--ol);color:#fff;border:0;border-radius:10px;padding:8px 12px;white-space:nowrap}
.nob{background:#fff;color:var(--mr);border:1px solid var(--mr);border-radius:10px;padding:8px 12px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:#EEF1E2;color:var(--ol);font-family:"Tiro Devanagari Hindi"}
.bar{position:sticky;top:0;z-index:15;background:var(--iv);padding:8px 0 6px;border-bottom:1px solid #E7DDC2}
.srow{display:flex;gap:8px}.sbox{flex:1;position:relative}.sbox input{width:100%;padding:11px 36px 11px 38px;border:1.8px solid var(--gd);border-radius:24px;background:#fff;font-size:16px}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}.sbox .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#EFE6CC;border-radius:50%;width:24px;height:24px;line-height:22px;display:none}
.lang{display:flex;border:1.8px solid var(--ol);border-radius:22px;overflow:hidden}.lang button{border:0;background:#fff;padding:0 12px;font-weight:700}.lang button.on{background:var(--ol);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.3px solid #D8CDAE;background:#fff;border-radius:16px;padding:5px 11px;font-size:13.5px;white-space:nowrap}.chip.on{background:var(--ol);border-color:var(--ol);color:#fff}
.sel{flex:none;border:1.3px solid #D8CDAE;background:#fff;border-radius:16px;padding:5px 8px;font-size:13.5px;max-width:200px}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);padding-top:6px}.stats b{color:var(--ol)}
.sec{margin-top:14px;background:var(--ol2);color:#fff;font-family:"Martel";text-align:center;border-radius:10px;padding:8px 6px;font-size:15.5px}
.zone{margin-top:8px;background:var(--iv2);border-top:2px solid var(--gd);border-bottom:2px solid var(--gd);color:var(--ol);font-family:"Martel";padding:8px 10px;display:flex;justify-content:space-between;cursor:pointer}
.area{margin-top:6px;background:var(--mh);color:#fff;font-family:"Martel";text-align:center;border-radius:8px;padding:6px;font-size:14.5px;cursor:pointer;user-select:none}
.cnt{font-family:"Tiro Devanagari Hindi";opacity:.9;font-size:13px}.closed+.box{display:none}

.t1{display:flex;gap:9px;align-items:flex-start}.nb{flex:none;min-width:44px;text-align:center;font-family:"Martel";font-size:14px;color:#fff;background:var(--mr);border-radius:8px;padding:3px 5px}
.nm{font-family:"Martel";font-size:16.5px;line-height:1.35}.sub2{font-size:13px;color:var(--mu);margin-top:1px}
.mob{display:inline-flex;align-items:center;gap:4px;color:var(--ol);text-decoration:none;font-size:14px;margin-top:3px}
.fn{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.f{font-size:12px;border-radius:8px;padding:2px 7px;background:#EEF1E2;color:var(--ol)}.f.off{background:#F3F1EA;color:#B3AC96;text-decoration:line-through}
.f b{font-family:"Martel"}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12.5px}.meta span{border-radius:8px;padding:1px 7px;background:#F6EAC9;color:#6B5520}

.tk.on{background:var(--ol);color:#fff}.tk small{display:block;font-size:11px;opacity:.88}.tk:disabled{opacity:.6}
mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mu);padding:30px 0}.more{display:block;margin:10px auto;border:1px solid var(--gd);background:#fff;border-radius:18px;padding:7px 16px;color:var(--ol)}
.log div{border-bottom:1px dashed #E7DDC2;padding:6px 0;font-size:13px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ol2);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:40}

.chip{font-size:15px;padding:6px 12px}.sel{font-size:15px}.stats{font-size:14px}.sec{font-size:17px}.area{font-size:16px}.cnt{font-size:14px}.sub2{font-size:14.5px}.mob{font-size:15px}

<script>/* 10 Nov (his words): "mouse ka cursor use karke right left align karne ke liye koi button bhi laga do laptop aur phone dono" -> ‹ › on every sideways chip row */
(function(){ function upd(el){ const w=el.parentNode; if(!w||!w.classList||!w.classList.contains('chw')) return; const o=el.scrollWidth>el.clientWidth+4; w.classList.toggle('sl',o&&el.scrollLeft>4); w.classList.toggle('sr',o&&el.scrollLeft+el.clientWidth<el.scrollWidth-4); }
 function wrap(el){ if(el.parentNode.classList&&el.parentNode.classList.contains('chw')) return; const w=document.createElement('div'); w.className='chw'; el.parentNode.insertBefore(w,el); w.appendChild(el);
  ['l','r'].forEach(k=>{ const b=document.createElement('button'); b.type='button'; b.className='cnb '+k; b.textContent=k==='l'?'‹':'›'; b.setAttribute('aria-label',k==='l'?'left':'right');
   b.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); el.scrollBy({left:(k==='l'?-1:1)*Math.max(160,el.clientWidth*.7),behavior:'smooth'}); }); w.appendChild(b); });
  el.addEventListener('scroll',()=>upd(el),{passive:true}); }
 function scan(){ document.querySelectorAll('.chips').forEach(el=>{ const ox=getComputedStyle(el).overflowX; if(ox!=='auto'&&ox!=='scroll') return; if(el.scrollWidth>el.clientWidth+4) wrap(el); upd(el); }); }
 let t; const go=()=>{ clearTimeout(t); t=setTimeout(scan,90); };
 new MutationObserver(go).observe(document.documentElement,{subtree:true,childList:true}); addEventListener('resize',go); document.addEventListener('DOMContentLoaded',go); go(); })();</script>
